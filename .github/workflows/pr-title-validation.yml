name: PR Title Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [master, dev, testing]

permissions:
  pull-requests: write
  statuses: write
  checks: write

jobs:
  validate-pr-title:
    name: ✅ Validate PR Title
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate PR Title
        id: validate
        uses: deepakputhraya/action-pr-title@v1.0.2
        with:
          # ============================================
          # ALLOWED TYPES (based on Conventional Commits)
          # ============================================
          allowed_types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
            security
            deps
            release
          
          # ============================================
          # FORMAT: type(scope): subject
          # ============================================
          regex: '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert|security|deps|release)(\([a-z0-9-]+\))?:\s.+'
          
          # ============================================
          # MESSAGE FORMATTING
          # ============================================
          case_sensitive: false
          validate_title_against_regex: true
          
          # ============================================
          # ERROR MESSAGES
          # ============================================
          error_message: |
            ❌ **Invalid PR Title Format**
            
            Your PR title must follow the **Conventional Commits** format:
            
