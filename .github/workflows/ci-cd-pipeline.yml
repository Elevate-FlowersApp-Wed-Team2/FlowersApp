name: CI/CD Pipeline

on:
  # ============================================
  # TRIGGERS
  # ============================================
  pull_request:
    branches: [master, dev, testing]
    types: [opened, synchronize, reopened]

  push:
    branches: [master, dev, testing]

# ============================================
# PERMISSIONS
# ============================================
permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

# ============================================
# CONCURRENCY
# ============================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================
# ENVIRONMENT VARIABLES
# ============================================
env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ============================================
  # JOB 1: LINT & FORMAT CHECK (FIXED)
  # ============================================
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ✅ FIX: Use dotnet format instead of dotnet-format
      - name: Check code formatting
        run: dotnet format --verify-no-changes

      - name: Run static code analysis
        run: |
          dotnet add package Microsoft.CodeAnalysis.NetAnalyzers || true
          dotnet build -c Release /p:RunAnalyzers=true || true

      - name: Lint Summary
        run: |
          echo "## 🔍 Lint Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code formatting check passed!" >> $GITHUB_STEP_SUMMARY
          echo "✅ Static code analysis completed!" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 2: BUILD (ALL SERVICES WITH MATRIX)
  # ============================================
  build:
    name: 🏗️ Build ${{ matrix.service }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            project: FlowersApp.Auth
            dockerfile: ./FlowersApp.Auth/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./${{ matrix.project }}/${{ matrix.project }}.csproj

      - name: Build
        run: dotnet build ./${{ matrix.project }}/${{ matrix.project }}.csproj --no-restore -c Release

      - name: Build Summary for Service
        run: |
          echo "## 🏗️ ${{ matrix.service }} Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dockerfile:** ${{ matrix.dockerfile }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 3: DOCKER BUILD VALIDATION (NO PUSH)
  # ============================================
  docker-build-validate:
    name: 🐳 Docker Build Validation ${{ matrix.service }}
    needs: [lint, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: ./FlowersApp.Auth/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Validate Docker build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service }}-test:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify Docker image exists
        run: |
          docker images | grep ${{ matrix.service }}-test
          echo "✅ Docker image for ${{ matrix.service }} built successfully!"

      - name: Docker Build Summary
        run: |
          echo "## 🐳 Docker Build Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dockerfile:** ${{ matrix.dockerfile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Build successful (no push)" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 4: FINAL SUMMARY
  # ============================================
  summary:
    name: 📊 Final Summary
    needs: [build, docker-build-validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Final Summary
        run: |
          echo "# ✅ CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Build | Docker Build |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|--------------|" >> $GITHUB_STEP_SUMMARY
          
          SERVICES=("auth" "profile" "nutrition" "workout" "progress" "fitnesscalc")
          for service in "${SERVICES[@]}"; do
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              build_status="✅"
            else
              build_status="❌"
            fi
            
            if [[ "${{ needs.docker-build-validate.result }}" == "success" ]]; then
              docker_status="✅"
            else
              docker_status="❌"
            fi
            
            echo "| $service | $build_status | $docker_status |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if all passed
          if [[ "${{ needs.build.result }}" == "success" && \
                "${{ needs.docker-build-validate.result }}" == "success" ]]; then
            echo "## 🎉 All Builds Passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All 6 services passed:**" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Lint check" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Build" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Docker build validation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 **Ready for deployment!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Some Builds Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Please check the failed services above and fix the issues.**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY

      - name: Check if all passed
        id: check_status
        run: |
          if [[ "${{ needs.build.result }}" == "success" && \
                "${{ needs.docker-build-validate.result }}" == "success" ]]; then
            echo "all_passed=true" >> $GITHUB_OUTPUT
          else
            echo "all_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set PR Status (Success)
        if: steps.check_status.outputs.all_passed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ All Builds Passed!
              
              All 6 services passed:
              - ✅ Lint check
              - ✅ Build
              - ✅ Docker build validation
              
              🚀 **Ready for deployment!**`
            })

      - name: Set PR Status (Failure)
        if: steps.check_status.outputs.all_passed == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Some Builds Failed!
              
              Please check the build logs above and fix the issues.
              
              ### Failed Checks
              ${{ needs.build.result != 'success' && '- Build failed\n' || '' }}
              ${{ needs.docker-build-validate.result != 'success' && '- Docker build validation failed\n' || '' }}
              
              Check the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            })

      - name: Create Badge
        if: steps.check_status.outputs.all_passed == 'true'
        run: |
          echo "# 🚀 All Builds Passing" >> build-status.txt
          echo "![Build Passing](https://img.shields.io/badge/build-passing-brightgreen)" >> build-status.txt

      - name: Upload badge
        if: steps.check_status.outputs.all_passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-status
          path: build-status.txt
