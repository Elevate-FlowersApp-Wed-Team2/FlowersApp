name: CI/CD Pipeline

on:
  # ============================================
  # TRIGGERS
  # ============================================
  pull_request:
    branches: [master, dev, testing]
    types: [opened, synchronize, reopened]

  push:
    branches: [master, dev, testing]

# ============================================
# PERMISSIONS
# ============================================
permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

# ============================================
# CONCURRENCY
# ============================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================
# ENVIRONMENT VARIABLES
# ============================================
env:
  DOTNET_VERSION: '8.0.x'
  # TODO: replace with your actual solution file name
  SOLUTION_FILE: 'FlowersApp.sln'

jobs:
  # ============================================
  # JOB 1: BUILD (ALL SERVICES WITH MATRIX)
  # ============================================
  build:
    name: 🏗️ Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            project: FlowersApp.Auth
            dockerfile: ./FlowersApp.Auth/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./${{ matrix.project }}/${{ matrix.project }}.csproj

      - name: Build
        run: dotnet build ./${{ matrix.project }}/${{ matrix.project }}.csproj --no-restore -c Release

      - name: Build Summary for Service
        run: |
          echo "## 🏗️ ${{ matrix.service }} Service" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ matrix.project }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dockerfile:** ${{ matrix.dockerfile }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 2: DOCKER BUILD VALIDATION (NO PUSH)
  # ============================================
  docker-build-validate:
    name: 🐳 Docker Build Validation ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: ./FlowersApp.Auth/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Validate Docker build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service }}-test:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify Docker image exists
        run: |
          docker images | grep ${{ matrix.service }}-test
          echo "✅ Docker image for ${{ matrix.service }} built successfully!"

      - name: Docker Build Summary
        run: |
          echo "## 🐳 Docker Build Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dockerfile:** ${{ matrix.dockerfile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Build successful (no push)" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 3: FINAL SUMMARY (now actually fails the pipeline)
  # ============================================
  summary:
    name: 📊 Final Summary
    needs: [build, docker-build-validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Final Summary
        run: |
          echo "# ✅ CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build Validation | ${{ needs.docker-build-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.docker-build-validate.result }}" == "success" ]]; then
            echo "## 🎉 All Checks Passed!" >> $GITHUB_STEP_SUMMARY
            echo "🚀 **Ready for deployment!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Some Checks Failed" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Please check the failed jobs above and fix the issues.**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 Details" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY

      - name: Check if all passed
        id: check_status
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.docker-build-validate.result }}" == "success" ]]; then
            echo "all_passed=true" >> $GITHUB_OUTPUT
          else
            echo "all_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR (Success)
        if: steps.check_status.outputs.all_passed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ All Checks Passed!\n\n- ✅ Lint check\n- ✅ Build\n- ✅ Docker build validation\n\n🚀 **Ready for deployment!**`
            })

      - name: Comment on PR (Failure)
        if: steps.check_status.outputs.all_passed == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Some Checks Failed!\n\nPlease check the workflow logs and fix the issues.\n\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            })

      - name: Create badge
        if: steps.check_status.outputs.all_passed == 'true'
        run: |
          echo "# 🚀 All Builds Passing" >> build-status.txt
          echo "![Build Passing](https://img.shields.io/badge/build-passing-brightgreen)" >> build-status.txt

      - name: Upload badge
        if: steps.check_status.outputs.all_passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-status
          path: build-status.txt

      # ✅ FIX: this is the step that was missing. Without it, this job
      # always exits 0 (success) no matter what happened upstream, which
      # is why branch protection couldn't rely on it as a required check.
      - name: Fail job if any check failed
        if: steps.check_status.outputs.all_passed == 'false'
        run: |
          echo "::error::One or more required checks failed (lint, build, or docker-build-validate)."
          exit 1
